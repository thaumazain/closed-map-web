<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PINLOG でお店がシェアされました</title>
<meta name="description" content="友だちのおすすめのお店がシェアされました。PINLOG のアプリで開けます。">

<!--
  アプリからシェアした店のリンク（https://pinlogapp.com/places/<placeId>?ll=<緯度>,<経度>）の受け皿
  （thaumazain/closed_map#1605）。

  ⚠️ **このページは店名も写真も出さない。API も呼ばない。**
     店名・住所・評価・写真は、シェアした人がアプリから文と画像で直接送っている。
     ここに店の中身を出すと、リンクを知っているだけの人に PINLOG のデータを公開することになる。

  ⚠️ **このページが出る＝アプリが入っていない、とは限らない。**（invite/index.html と同じ）
     Universal Links はアプリがあれば直接アプリへ飛ぶが、LINE のアプリ内ブラウザなどではここに落ちる。
     そのため上に「PINLOG で開く」（カスタムスキーム）を置く。

  ⚠️ **自動で App Store へ飛ばさない。** 押してもらう。

  ll（座標）は「Google マップで開く」のためだけ。店名で検索しないので、開くとその地点になる。
-->

<meta property="og:title" content="PINLOG">
<meta property="og:description" content="友だちのおすすめのお店がシェアされました">
<meta property="og:type" content="website">
<meta property="og:image" content="https://pinlogapp.com/img/icon-192.png">

<style>
  :root {
    --bg: #FAF8F4; --surface: #FFFFFF; --text: #2C2825; --muted: #7A7068;
    --accent: #4ECDC4; --on-accent: #1F3A38; --border: #E5E0D9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    line-height: 1.8;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .card {
    background: var(--surface); border-radius: 20px; padding: 40px 28px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
  }
  h1 { font-size: 22px; margin: 0 0 8px; color: var(--text); }
  .lead { font-size: 14px; color: var(--muted); margin: 0 0 28px; }
  .btn {
    display: block; width: 100%; padding: 15px 20px; border-radius: 999px;
    font-size: 15px; font-weight: 600; text-decoration: none;
    /* ⚠️ accent の上に白を置かない。コントラスト 1.93 で WCAG AA を満たさない */
    background: var(--accent); color: var(--on-accent);
    margin-bottom: 12px;
  }
  .btn.sub {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); font-weight: 400;
  }
  .note { font-size: 12px; color: var(--muted); margin-top: 20px; }
  .note a { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>お店がシェアされました</h1>
    <p class="lead">
      友だちの投稿は PINLOG で見られます。<br>
      PINLOG は招待制の地図アプリです。
    </p>

    <a class="btn" id="open" href="#">PINLOG で開く</a>
    <a class="btn sub" id="map" href="#">Google マップで開く</a>
    <a class="btn sub" id="store" href="https://apps.apple.com/app/id6801804300">アプリを入れてない方はこちら</a>

    <p class="note">
      <a href="/privacy.html">プライバシーポリシー</a> ・
      <a href="/terms.html">利用規約</a>
    </p>
  </div>

<script>
  // 「PINLOG で開く」はカスタムスキームへ。Universal Links が効かない状況（LINE のアプリ内ブラウザ等）の逃げ道。
  // 「Google マップで開く」は ll の座標で開く。読めなければ隠す。
  //
  // ⚠️ パスから ID を取り出すだけで、検証はしない。ここは入口の案内であって、認可はアプリと API が行う。
  var parts = location.pathname.split('/').filter(Boolean);
  var id = parts[0] === 'places' ? parts[1] : null;
  var open = document.getElementById('open');
  if (id) {
    open.href = 'pinlog://places/' + encodeURIComponent(decodeURIComponent(id));
  } else {
    open.style.display = 'none';
  }

  var ll = new URLSearchParams(location.search).get('ll') || '';
  var map = document.getElementById('map');
  if (/^-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$/.test(ll)) {
    map.href = 'https://www.google.com/maps/search/?api=1&query=' + ll;
  } else {
    map.style.display = 'none';
  }
</script>
</body>
</html>
